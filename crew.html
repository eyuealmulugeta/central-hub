<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Crew form · Amistad Prefab</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <!-- v0.40.2: the link preview a candidate sees (WhatsApp, Telegram): Amistad Prefab only -->
  <meta name="description" content="Fill in your details for Amistad Prefab. Take a picture of your ID and of yourself.">
  <meta property="og:site_name" content="Amistad Prefab">
  <meta property="og:title" content="Amistad Prefab · Crew form">
  <meta property="og:description" content="Fill in your details for Amistad Prefab. Take a picture of your ID and of yourself.">
  <meta property="og:image" content="https://hub.amistadprefab.com/assets/logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="application-name" content="Amistad Prefab">
  <meta name="apple-mobile-web-app-title" content="Amistad Prefab">
  <style>
    :root { --bg: #f4f5f7; --surface: #fff; --ink: #1f2328; --muted: #5f6672; --line: #dfe2e7; --brand: #0a3440; --gold: #b47d14; --ok: #1a7f4b; --bad: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--brand); color: #f3efe6; }
    header img { width: 40px; height: 40px; border-radius: 10px; }
    header b { display: block; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
    header span { font-size: 12px; color: #e6ad45; letter-spacing: .08em; text-transform: uppercase; }
    main { max-width: 920px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .ok { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 400; background: #fff; color: var(--ink); width: 100%; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .shots { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }
    .shot { width: 140px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; }
    .shot img, .shot .empty { width: 140px; height: 94px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #eef0f3; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 400; }
    .shot.face img, .shot.face .empty { width: 110px; height: 130px; }
    .shot .pick { display: flex; gap: 6px; } .shot .pick label.btn { flex: 1; padding: 8px 6px; }
    .shot label.btn { margin: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; text-align: center; cursor: pointer; background: #fff; flex-direction: row; justify-content: center; }
    .note { background: #fff7e6; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .check { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 400; margin: 14px 0 0; }
    .check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
    button { padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    footer { padding: 8px 16px 24px; text-align: center; }
    /* v1.15.0: the document scan and Fix corners */
    .shot.doc { width: 180px; } .shot.doc img, .shot.doc .empty { width: 180px; height: 114px; }
    .shot.doc img { object-fit: contain; background: #fff; }
    .shot .pick button.btn { flex: 1; padding: 6px 4px; font-size: 12px; white-space: nowrap; }
    .shot.doc .pick label.btn { white-space: nowrap; font-size: 12px; }
    .fixer { position: fixed; inset: 0; background: rgb(0 0 0 / .6); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 12px; }
    .fixbox { background: var(--surface); border-radius: 14px; padding: 14px; max-width: 760px; width: 100%; max-height: 100%; overflow: auto; }
    .fixarea { position: relative; touch-action: none; user-select: none; }
    .fixarea img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }
    .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgb(230 173 69 / .45); border: 3px solid #e6ad45; box-shadow: 0 0 0 2px #fff; touch-action: none; cursor: grab; }
    @media print { header, .no-print, footer { display: none; } body { background: #fff; } .card { box-shadow: none; padding: 0; } .pages { max-height: none; background: none; padding: 0; } }
  </style>
</head>
<body>
  <header><img src="assets/logo.png" alt=""><div><b id="from">Amistad Prefab</b><span>Crew form</span></div></header>
  <main id="app"><div class="card"><p class="muted">Opening the form…</p></div></main>
  <footer class="muted">Your details go only to the office of Amistad Prefab, for your employment records. The pictures are read on this phone; nothing is sent until you press Send.</footer>
  <script type="module" src="js/crewpage.js"></script>
</body>
</html>
