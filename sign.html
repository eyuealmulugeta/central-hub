<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign a document · Amistad Prefab</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    :root { --bg: #f4f5f7; --surface: #fff; --ink: #1f2328; --muted: #5f6672; --line: #dfe2e7; --brand: #0a3440; --gold: #b47d14; --ok: #1a7f4b; --bad: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--brand); color: #f3efe6; }
    header img { width: 40px; height: 40px; border-radius: 10px; }
    header b { display: block; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
    header span { font-size: 12px; color: #e6ad45; letter-spacing: .08em; text-transform: uppercase; }
    main { max-width: 920px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .ok { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    .doc-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .pages { display: flex; flex-direction: column; gap: 10px; background: #e9ebef; padding: 10px; border-radius: 10px; max-height: 75vh; overflow: auto; }
    .pages canvas { width: 100%; height: auto; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    input[type=text] { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 400; }
    .pad-wrap { position: relative; border: 2px dashed var(--line); border-radius: 12px; background: #fcfcfd; touch-action: none; }
    #pad { display: block; width: 100%; height: 190px; touch-action: none; cursor: crosshair; }
    .pad-wrap::after { content: 'Draw your signature here'; position: absolute; left: 14px; bottom: 8px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .pad-wrap.drawn::after { content: ''; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .check { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 400; margin: 14px 0 0; }
    .check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
    button { padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .sig { max-height: 80px; max-width: 260px; border-bottom: 1px solid var(--ink); }
    footer { padding: 8px 16px 24px; text-align: center; }
    @media print { header, .no-print, footer { display: none; } body { background: #fff; } .card { box-shadow: none; padding: 0; } .pages { max-height: none; background: none; padding: 0; } }
  </style>
</head>
<body>
  <header><img src="assets/logo.png" alt=""><div><b id="from">Amistad Prefab</b><span>Document signing</span></div></header>
  <main id="app"><div class="card"><p class="muted">Opening the document…</p></div></main>
  <footer class="muted">Signed electronically through Amistad Prefab Central Hub. Your name, signature, the date and time are recorded with the document.</footer>
  <script type="module" src="js/signpage.js"></script>
</body>
</html>
